<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LeetLog</title>
<style>
  :root {
    --bg: #17140f;
    --panel: #1f1a12;
    --panel-2: #221d14;
    --border: #3a3222;
    --text: #f1e9d2;
    --text-dim: #a89b78;
    --amber: #ffb020;
    --green: #8fbc6a;
    --track-on: #4a3f26;
    --border-focus: #6b5a2e;
  }
  :root[data-theme="light"] {
    --bg: #fdfaf3;
    --panel: #f4eee0;
    --panel-2: #ece4d1;
    --border: #ddd2b8;
    --text: #2e2718;
    --text-dim: #6f6549;
    --amber: #b07405;
    --green: #4e7a2a;
    --track-on: #cfc09a;
    --border-focus: #c2a961;
  }

  * { box-sizing: border-box; }

  body {
    width: 268px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .cursor { width: 8px; height: 14px; background: var(--amber); flex: none; }
  .name { font-size: 13px; font-weight: 600; flex: 1; }
  .streak { font-size: 11px; color: var(--amber); }

  .who {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 12px 16px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .who .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); flex: none; }
  .who .dot.ok { background: var(--green); }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .row .label { flex: 1; line-height: 1.35; }
  .row .sub { display: block; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }

  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    width: 13px; height: 13px;
    left: 2px; top: 2px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 140ms ease, background 140ms ease;
  }
  .switch input:checked + .track { background: var(--track-on); border-color: var(--border-focus); }
  .switch input:checked + .track::before { transform: translateX(16px); background: var(--amber); }

  .revisit {
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1px solid var(--border);
  }
  .revisit-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 7px;
  }
  .revisit-title { font-size: 11.5px; color: var(--text-dim); flex: 1; }
  .revisit-count { font-size: 11px; color: var(--amber); }

  .revisit-list { list-style: none; margin: 0; padding: 0; }
  .revisit-list li { margin-bottom: 4px; }
  .revisit-list a {
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 11.5px;
    padding: 4px 6px;
    margin: 0 -6px;
    border-radius: 4px;
  }
  .revisit-list a:hover { background: var(--panel); }
  .revisit-list .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .revisit-list .age { color: var(--text-dim); font-size: 10.5px; flex: none; }

  .open-settings {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 9px;
    cursor: pointer;
    text-align: center;
  }
  .open-settings:hover { color: var(--text); border-color: var(--border-focus); }
</style>
</head>
<body>
  <div class="head">
    <div class="cursor"></div>
    <div class="name">LeetLog</div>
    <div class="streak" id="streak"></div>
  </div>

  <div class="who" id="who"><span class="dot"></span><span>checking…</span></div>

  <div class="row">
    <div class="label">
      Show the panel
      <span class="sub">on LeetCode problem pages</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span class="track"></span>
    </label>
  </div>

  <div class="row">
    <div class="label">
      Offer to commit solutions
      <span class="sub">after an Accepted submission</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="askToggle" />
      <span class="track"></span>
    </label>
  </div>

  <div class="revisit" id="revisit" hidden>
    <div class="revisit-head">
      <span class="revisit-title">Worth revisiting</span>
      <span class="revisit-count" id="revisitCount"></span>
    </div>
    <ul class="revisit-list" id="revisitList"></ul>
  </div>

  <button class="open-settings" id="openSettings" type="button">Extension settings</button>

  <script src="popup.js"></script>
</body>
</html>
